services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app # ok: docker service with a default password
      CACHE_URL: redis://:{{fake:db-password:2}}@cache.example.net:6379 # ok: example host from documentation
  db:
    image: postgres:17
  helm:
    image: busybox
    command: ["sh", "-c", 'printf "postgresql://spicedb:%s@%s:%s/spicedb" "$PASS" "$HOST" "$PORT"'] # ok: printf placeholders
