name: Publish with trusted publishing

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # ok: trusted publishing in a workflow that pull requests do not trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish # ok: trusted publishing needs no token
