name: CI

on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ok: a test job (cloud login); forks get no OIDC token and nothing is published
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test

  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # expect-warn: ci/publish-token
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm publish --tag canary --provenance

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ok: this job runs only for tag pushes
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc # expect-warn: ci/publish-token
          npm publish
