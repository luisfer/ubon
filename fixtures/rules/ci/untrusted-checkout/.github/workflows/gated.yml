name: Gated tests

on:
  pull_request_target:
    types: [opened, synchronize, labeled]

jobs:
  same-repo-or-label:
    # Same-repository branches run at once; forks need the label.
    if: github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'safe to test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }} # expect-warn: ci/untrusted-checkout
      - run: npm ci && npm test

  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.payload.pull_request.user.login });
            if (!['admin', 'write'].includes(data.permission)) core.setFailed('Not a collaborator');

  e2e:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }} # expect-warn: ci/untrusted-checkout
      - run: npm ci && npm run e2e
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
