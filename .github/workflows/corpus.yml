name: corpus

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Fetch the pinned repositories
        run: node scripts/corpus.mjs fetch
      - name: Every finding is triaged
        run: node scripts/corpus.mjs run --strict
      - name: docs/precision.md is up to date
        run: node scripts/corpus.mjs report --check
